# .github/workflows/tests.yml
#
# GitHub Actions CI for the Zygisk Study project.
# Runs the host-side unit tests against every push and pull request.
#
# NOTE (Round 34): .github/workflows/build.yml runs the full gate
# suite (C++ + script E2E + daemon E2E + cargo + trampoline binary
# verification) on EVERY push and EVERY pull request before
# cross-building the flashable module zip with the Android NDK. This
# file is the lean main-branch badge signal; the zip pipeline and the
# PR gates live in build.yml.
#
# What this workflow verifies:
#
#   - The five C++ test binaries (test_hide, test_hide_advanced,
#     test_hide_stealth, test_e2e_hide, test_perf) build cleanly
#     with g++ -Wall -Wextra and pass their assertions.
#
#   - The Rust daemon's #[cfg(test)] unit tests build and pass.
#     (Skipped on the host because the daemon depends on getprop
#     which doesn't exist outside Android; we run only the pure-
#     logic parser tests that don't touch the OS.)
#
# What this workflow does NOT do:
#
#   - It does not compile the production .so files (libzygisk.so,
#     libpayload.so, libzn_loader.so) because that requires the
#     Android NDK, which is a heavy install. The CMakeLists.txt
#     files are in the repo so an Android-aware contributor can
#     build them locally; the CI just makes sure the test suite
#     (which compiles the .cpp files directly via #include) passes.
#
#   - It does not run any Android integration tests. Those require
#     an emulator + a rooted system image, which is too heavy for
#     free-tier CI. The host tests cover the parsing and decision
#     logic; the syscall-touching paths (unshare, umount2,
#     __system_property_set) are documented as Android-only.

name: tests

# ROUND 34 (B3 + B12): build.yml now runs the FULL gate suite (C++,
# script E2E, daemon E2E, cargo, trampoline verification) on every
# push AND every pull_request, so this file no longer duplicates PR
# coverage (it predated that trigger and covered PRs with C++ only —
# the gap that let daemon/script PRs merge on a green C++ signal).
# What remains here: the lean C++ badge signal for main pushes, with
# the dead `if: false` Rust job removed (it ran `cargo test --no-run`
# guarded off — pure dead weight) and the preinstalled-only deps (the
# apt-get step bought nothing: g++/make ship on ubuntu-latest).
on:
  push:
    branches: [ main, master ]

jobs:
  cpp-tests:
    name: C++ host-side unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install keystone-engine (trampoline binary verification)
        run: python3 -m pip install --user keystone-engine
      - name: Build & run tests
        working-directory: tests
        run: make run
